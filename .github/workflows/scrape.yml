git clone https://github.com/uasususu/roblox-ugc-tracker.git
cd roblox-ugc-tracker
mkdir -p .github/workflows
cat > .github/workflows/scrape.yml << 'EOF'
name: Track Roblox UGC Drops

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-ugc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: node index.js
      - id: check_changes
        run: |
          if git diff --quiet seen.js; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen.js
          git commit -m "Update seen.js with new UGC drops - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
EOF
git add .github/workflows/scrape.yml
git commit -m "Add GitHub Actions workflow"
git push
